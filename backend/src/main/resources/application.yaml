spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rag_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

openai:
  api-key: ${OPENAI_API_KEY}
  default-model: gpt-4o-mini
  timeout:
    connect-seconds: ${OPENAI_CONNECT_TIMEOUT_SECONDS:3}
    read-seconds: ${OPENAI_READ_TIMEOUT_SECONDS:20}
  pricing:
    usd-to-jpy: 150.0
    models:
      gpt-4o:
        input-usd-per1m-tokens: 2.50
        output-usd-per1m-tokens: 10.00
      gpt-4o-mini:
        input-usd-per1m-tokens: 0.15
        output-usd-per1m-tokens: 0.60

rag:
  top-k: ${RAG_TOP_K:3}
  vector-search-enabled: ${RAG_VECTOR_SEARCH_ENABLED:true}
  embedding-model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
  embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
  min-similarity-score: ${RAG_MIN_SIMILARITY_SCORE:0.4}
  rerank-enabled: ${RAG_RERANK_ENABLED:false}
  rerank-candidate-multiplier: ${RAG_RERANK_CANDIDATE_MULTIPLIER:3}
  groundedness-threshold: ${RAG_GROUNDEDNESS_THRESHOLD:0.7}
  groundedness-fallback-enabled: ${RAG_GROUNDEDNESS_FALLBACK_ENABLED:true}
  groundedness-fallback-score-threshold: ${RAG_GROUNDEDNESS_FALLBACK_SCORE_THRESHOLD:0.3}

app:
  reindex-jobs:
    cleanup-enabled: ${REINDEX_JOBS_CLEANUP_ENABLED:true}
    retention: ${REINDEX_JOBS_RETENTION:7d}
    cleanup-interval-ms: ${REINDEX_JOBS_CLEANUP_INTERVAL_MS:3600000}
  security:
    admin:
      username: ${AUDIT_ADMIN_USERNAME:admin}
      password: ${AUDIT_ADMIN_PASSWORD:change-me}
      roles:
        - ADMIN
    operator:
      username: ${AUDIT_OPERATOR_USERNAME:operator}
      password: ${AUDIT_OPERATOR_PASSWORD:change-operator}
      roles:
        - OPERATOR
    jwt:
      secret: ${APP_JWT_SECRET:change-this-jwt-secret-in-production-at-least-32-bytes}
      expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:3600}
      issuer: ${APP_JWT_ISSUER:llm-rag-platform}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics

resilience4j:
  retry:
    instances:
      openai:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        exponential-max-wait-duration: 3s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.example.llmragplatform.exception.OpenAiTemporarilyUnavailableException
  circuitbreaker:
    instances:
      openai:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
