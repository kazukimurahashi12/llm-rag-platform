services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: onboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - onboard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onboard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rag_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      RAG_VECTOR_SEARCH_ENABLED: ${RAG_VECTOR_SEARCH_ENABLED:-true}
      RAG_MIN_SIMILARITY_SCORE: ${RAG_MIN_SIMILARITY_SCORE:-0.4}
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-false}
      AUDIT_ADMIN_USERNAME: ${AUDIT_ADMIN_USERNAME:-admin}
      AUDIT_ADMIN_PASSWORD: ${AUDIT_ADMIN_PASSWORD:-change-me}
      AUDIT_OPERATOR_USERNAME: ${AUDIT_OPERATOR_USERNAME:-operator}
      AUDIT_OPERATOR_PASSWORD: ${AUDIT_OPERATOR_PASSWORD:-change-operator}
    ports:
      - "8080:8080"

  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: onboard-backend-go
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: compose
      PORT: 8081
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-this-jwt-secret-in-production-at-least-32-bytes}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-llm-rag-platform}
      APP_JWT_EXPIRATION_SECONDS: ${APP_JWT_EXPIRATION_SECONDS:-3600}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rag_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      OPENAI_CONNECT_TIMEOUT_SECONDS: ${OPENAI_CONNECT_TIMEOUT_SECONDS:-3}
      OPENAI_READ_TIMEOUT_SECONDS: ${OPENAI_READ_TIMEOUT_SECONDS:-20}
      OPENAI_RETRY_MAX_ATTEMPTS: ${OPENAI_RETRY_MAX_ATTEMPTS:-3}
      OPENAI_RETRY_INITIAL_BACKOFF_MILLIS: ${OPENAI_RETRY_INITIAL_BACKOFF_MILLIS:-500}
      OPENAI_RETRY_MAX_BACKOFF_MILLIS: ${OPENAI_RETRY_MAX_BACKOFF_MILLIS:-3000}
      OPENAI_CIRCUIT_BREAKER_FAILURE_THRESHOLD_PERCENT: ${OPENAI_CIRCUIT_BREAKER_FAILURE_THRESHOLD_PERCENT:-50}
      OPENAI_CIRCUIT_BREAKER_MINIMUM_CALLS: ${OPENAI_CIRCUIT_BREAKER_MINIMUM_CALLS:-10}
      OPENAI_CIRCUIT_BREAKER_WINDOW_SIZE: ${OPENAI_CIRCUIT_BREAKER_WINDOW_SIZE:-20}
      OPENAI_CIRCUIT_BREAKER_OPEN_SECONDS: ${OPENAI_CIRCUIT_BREAKER_OPEN_SECONDS:-30}
      OPENAI_CIRCUIT_BREAKER_HALF_OPEN_MAX_CALLS: ${OPENAI_CIRCUIT_BREAKER_HALF_OPEN_MAX_CALLS:-3}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      RAG_VECTOR_SEARCH_ENABLED: ${RAG_VECTOR_SEARCH_ENABLED:-true}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
      RAG_MIN_SIMILARITY_SCORE: ${RAG_MIN_SIMILARITY_SCORE:-0.4}
      RAG_GROUNDEDNESS_THRESHOLD: ${RAG_GROUNDEDNESS_THRESHOLD:-0.7}
      RAG_GROUNDEDNESS_FALLBACK_ENABLED: ${RAG_GROUNDEDNESS_FALLBACK_ENABLED:-true}
      RAG_GROUNDEDNESS_FALLBACK_SCORE_THRESHOLD: ${RAG_GROUNDEDNESS_FALLBACK_SCORE_THRESHOLD:-0.3}
      ADVICE_PROMPT_TEMPLATE_PATH: /app/prompts/management-coach-v1.0.txt
      GROUNDEDNESS_PROMPT_TEMPLATE_PATH: /app/prompts/groundedness-judge-v1.0.txt
      AUDIT_ADMIN_USERNAME: ${AUDIT_ADMIN_USERNAME:-admin}
      AUDIT_ADMIN_PASSWORD: ${AUDIT_ADMIN_PASSWORD:-change-me}
      AUDIT_OPERATOR_USERNAME: ${AUDIT_OPERATOR_USERNAME:-operator}
      AUDIT_OPERATOR_PASSWORD: ${AUDIT_OPERATOR_PASSWORD:-change-operator}
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onboard-frontend
    restart: unless-stopped
    depends_on:
      backend-go:
        condition: service_started
    environment:
      VITE_API_BASE_URL: http://localhost:8081
      VITE_APP_ENV: compose
    ports:
      - "5173:5173"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: onboard-prometheus
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - onboard-prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: onboard-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - onboard-grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  onboard-postgres-data:
  onboard-prometheus-data:
  onboard-grafana-data:
